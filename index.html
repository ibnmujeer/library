<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FDC733">
  <title>Pride and Prejudice | Awwfy Studios</title>
  <meta name="description" content="Elizabeth Bennet learns how first impressions can hide the truth about people.">
  <link rel="canonical" href="https://awwfy.com/pride-and-prejudice/">
  <script>(function(){try{var t=localStorage.getItem('awwfy-theme');if(t==='light'||t==='dark'||t==='sepia'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <section id="start-screen">
    <header class="topbar"><span class="topbar-title">Pride and Prejudice</span><button type="button" class="btn btn-icon theme-toggle" aria-label="Switch to dark mode"></button></header>
    <main class="page">
      <img id="start-cover" class="start-cover" src="img/cover.webp" alt="Elizabeth and Jane Bennet look out across the grounds of Longbourn." width="1024" height="768">
      <h1 class="start-title">Pride and Prejudice</h1>
      <p class="credit">Retold from Pride and Prejudice by Jane Austen (1813).</p>
      <div class="actions"><button type="button" id="start-reading" class="btn btn-primary">Start reading</button><button type="button" id="all-chapters" class="btn">All chapters</button></div>
      <p class="level">Reading level: Confident</p>
      <p class="privacy">Your place is saved on this device only.</p>
      <a class="more-books" href="https://awwfy.com/reader/">More books in the Awwfy Reader</a>
    </main>
  </section>
  <section id="menu-screen" hidden>
    <header class="topbar"><button type="button" id="menu-back" class="btn">Back</button><span class="topbar-title">Chapters</span><button type="button" class="btn btn-icon theme-toggle" aria-label="Switch to dark mode"></button></header>
    <main class="page"><p id="menu-progress" class="menu-progress"></p><div id="menu-list" class="chapter-list"></div></main>
  </section>
  <div id="reader" class="reader top-only" hidden role="region" aria-label="Book reader">
    <div class="reader-top">
      <button type="button" class="btn btn-icon" id="reader-back" aria-label="Back to chapters"></button>
      <span class="topbar-title" id="reader-title"></span>
      <button type="button" class="btn btn-icon" id="contents-button" aria-label="Contents"></button>
      <button type="button" class="btn btn-icon" id="text-button" aria-label="Text settings"></button>
      <button type="button" class="btn btn-icon" id="speech-button" aria-label="Read to me"></button>
      <button type="button" class="btn btn-icon" id="fullscreen-button" aria-label="Full screen"></button>
    </div>
    <p class="run-head" id="run-head"></p>
    <div class="viewport" id="viewport"><div class="flow" id="flow"></div></div>
    <div class="page-status">
      <button type="button" class="btn btn-icon" id="previous-page" aria-label="Previous page"></button>
      <span class="page-count" id="page-count" aria-live="polite"></span><span class="time-left" id="time-left"></span>
      <button type="button" class="btn btn-icon" id="next-page" aria-label="Next page"></button>
    </div>
    <div class="reader-bottom"><input type="range" class="scrub" id="scrub" min="1" max="1" value="1" aria-label="Page"><div class="bottom-row"><span id="chapter-position"></span><span id="book-progress"></span></div></div>
    <section class="panel" id="text-panel" hidden role="dialog" aria-modal="true" aria-labelledby="text-heading"><div class="panel-head"><h2 id="text-heading">Text</h2><button type="button" class="btn panel-done">Done</button></div><div id="settings-rows"></div></section>
    <section class="panel" id="contents-panel" hidden role="dialog" aria-modal="true" aria-labelledby="contents-heading"><div class="panel-head"><h2 id="contents-heading">Chapters</h2><button type="button" class="btn panel-done">Done</button></div><div id="contents-list" class="chapter-list"></div><div class="panel-actions"><button type="button" id="back-to-start" class="btn">Back to start</button><a class="btn" href="https://awwfy.com/reader/">More books</a></div></section>
    <div class="load-state" id="load-state" hidden role="status"></div>
  </div>
  <div class="pop" id="meaning-box" hidden role="dialog" aria-label="Word meaning"><p class="pop-word"></p><p class="pop-meaning"></p><button type="button" class="btn" id="hear-word">Hear it</button></div>
  <script src="js/book.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
