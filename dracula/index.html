<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FDC733">
<title>Dracula | Awwfy Studios</title>
<meta name="description" content="Friends piece together letters and journals to trace a mysterious traveller across Europe.">
<link rel="canonical" href="https://awwfy.com/dracula/">
<script>(function(){try{var t=localStorage.getItem('awwfy-theme');if(t==='light'||t==='dark'||t==='sepia'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar"><button class="btn" id="back" hidden>Back</button><span class="topbar-title" id="bar-title">Dracula</span><button class="btn btn-icon" id="theme" aria-label="Switch to dark mode"></button></header>
<main>
<section class="page" id="start"><img class="cover" src="img/cover.webp" width="1024" height="768" alt="A traveller meets his host at a lamplit castle door."><h1>Dracula</h1><p class="credit">Retold from Dracula by Bram Stoker (1897).</p><div class="actions"><button class="btn btn-primary" id="begin">Start reading</button><button class="btn" id="all">All chapters</button></div><p class="level">Reading level: Confident</p><p class="device">Your place is saved on this device only.</p><a class="more" href="https://awwfy.com/reader/">More books in the Awwfy Reader</a></section>
<section class="page" id="menu" hidden><p class="progress"></p><div class="rows"></div></section>
<section class="reader top-only" aria-label="Chapter reader" hidden>
<div class="reader-top"><button class="btn btn-icon" id="leave" aria-label="Back"></button><span class="topbar-title" id="chapter-name"></span><button class="btn btn-icon" id="contents" aria-label="Contents"></button><button class="btn btn-icon" id="settings" aria-label="Text settings"></button><button class="btn btn-icon" id="voice" aria-label="Read to me"></button><button class="btn btn-icon" id="full" aria-label="Full screen"></button></div>
<p class="run-head"></p><div class="notice" role="status" hidden></div><div class="viewport"><div class="flow"></div></div>
<div class="page-status"><button class="btn btn-icon" id="prev" aria-label="Previous page"></button><span id="location"></span><span id="time"></span><button class="btn btn-icon" id="next" aria-label="Next page"></button></div>
<div class="reader-bottom"><input type="range" class="scrub" aria-label="Page" min="1" max="1" value="1"><div class="bottom-row"><span id="position"></span><span id="percent"></span></div></div>
<section class="panel" role="dialog" aria-labelledby="panel-title" hidden><div class="panel-head"><h2 id="panel-title"></h2><button class="btn" id="done">Done</button></div><div id="panel-body"></div></section>
</section></main>
<aside class="pop" aria-label="Word meaning" hidden><p class="pop-word"></p><p class="pop-meaning"></p><button class="btn" id="hear">Hear it</button></aside>
<script src="js/book.js"></script>
<script src="js/app.js"></script>
</body></html>
